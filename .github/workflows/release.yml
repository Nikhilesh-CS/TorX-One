name: Verified signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  security-events: write
jobs:
  gates:
    uses: ./.github/workflows/security-ci.yml
  sign:
    needs: gates
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
      - name: Build release and inventory
        working-directory: android
        env:
          TORX_STUN_URLS: ${{ vars.TORX_STUN_URLS }}
          TORX_TURN_URLS: ${{ vars.TORX_TURN_URLS }}
          TORX_TURN_USERNAME: ${{ secrets.TORX_TURN_USERNAME }}
          TORX_TURN_CREDENTIAL: ${{ secrets.TORX_TURN_CREDENTIAL }}
        run: |
          # The official 1.0 gate requires independent review and real beta evidence.
          # Pre-1.0 candidates can be built for assessment without fabricating results.
          if [[ "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]*\. ]]; then
            python3 tools/validate_release_evidence.py --require-complete
          else
            python3 tools/validate_release_evidence.py
          fi
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$version"
          bash ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:securityInventory
      - name: Sign, verify and checksum
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TRUSTED_SIGNING_CERT_SHA256: ${{ vars.TRUSTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          keyfile="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p release-artifacts
          "$tools/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out release-artifacts/torx-one.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs release-artifacts/torx-one.apk > release-artifacts/signing-certificate.txt
          approval_args=()
          if [[ "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]*\. ]]; then
            approval_args+=(--require-approved-ledger)
          fi
          python3 android/tools/verify_signed_candidate.py \
            --apk release-artifacts/torx-one.apk --apksigner "$tools/apksigner" --aapt "$tools/aapt" \
            --trusted-certificate-sha256 "$TRUSTED_SIGNING_CERT_SHA256" \
            --report release-artifacts/candidate-verification.json "${approval_args[@]}"
          python3 android/tools/inventory_apk_native.py --apk release-artifacts/torx-one.apk --output release-artifacts/native-libraries.json
          cp android/app/build/reports/security/{sbom.cdx.json,dependencies.txt} release-artifacts/
          cp android/app/build/outputs/mapping/release/mapping.txt release-artifacts/
          printf '%s\n' "$GITHUB_SHA" > release-artifacts/source-commit.txt
          (cd release-artifacts && sha256sum torx-one.apk sbom.cdx.json dependencies.txt native-libraries.json mapping.txt signing-certificate.txt candidate-verification.json source-commit.txt > SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/torx-one.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
