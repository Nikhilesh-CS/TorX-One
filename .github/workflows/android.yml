name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint (Debug)
      run: ./gradlew lintDebug

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Android Tests
      run: ./gradlew assembleAndroidTest

    # - name: Run Connected Android Tests
    #   uses: reactivecircus/android-emulator-runner@v2
    #   with:
    #     api-level: 33
    #     target: google_apis
    #     arch: x86_64
    #     script: ./gradlew connectedAndroidTest

  release-verification:
    # Release signing secrets are deliberately unavailable to untrusted pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      TORXONE_RELEASE_STORE_PASSWORD: ${{ secrets.TORXONE_RELEASE_STORE_PASSWORD }}
      TORXONE_RELEASE_KEY_ALIAS: ${{ secrets.TORXONE_RELEASE_KEY_ALIAS }}
      TORXONE_RELEASE_KEY_PASSWORD: ${{ secrets.TORXONE_RELEASE_KEY_PASSWORD }}
      TORXONE_RELEASE_CERT_SHA256: ${{ secrets.TORXONE_RELEASE_CERT_SHA256 }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Restore production keystore
      env:
        TORXONE_RELEASE_KEYSTORE_BASE64: ${{ secrets.TORXONE_RELEASE_KEYSTORE_BASE64 }}
      run: |
        test -n "$TORXONE_RELEASE_KEYSTORE_BASE64"
        test -n "$TORXONE_RELEASE_STORE_PASSWORD"
        test -n "$TORXONE_RELEASE_KEY_ALIAS"
        test -n "$TORXONE_RELEASE_KEY_PASSWORD"
        test -n "$TORXONE_RELEASE_CERT_SHA256"
        echo "$TORXONE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/torxone-release.jks"
        echo "TORXONE_RELEASE_STORE_FILE=$RUNNER_TEMP/torxone-release.jks" >> "$GITHUB_ENV"
    - name: Build signed release
      run: |
        chmod +x gradlew
        ./gradlew lintRelease assembleRelease
    - name: Verify release APK identity and certificate
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        test -s "$APK"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
        AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
        "$APKSIGNER" verify --verbose --print-certs "$APK"
        "$AAPT" dump badging "$APK" | grep "package: name='com.torxone.app'"
        VERSION_CODE=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
        test -n "$VERSION_CODE" && test "$VERSION_CODE" -gt 0
        ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n "s/.*SHA-256 digest: //p" | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
        test "$ACTUAL_CERT" = "$(echo "$TORXONE_RELEASE_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
        sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256
        stat --printf='APK bytes: %s\n' "$APK"
